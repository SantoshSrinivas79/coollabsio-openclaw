services:
  openclaw:
    image: openclaw:qmd
    container_name: openclaw
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
      # Gateway: keep host-local only (safer). Mission Control can use ws://host.docker.internal:18789
      - "127.0.0.1:${OPENCLAW_GATEWAY_PORT:-18789}:${OPENCLAW_GATEWAY_PORT:-18789}"
    environment:
      # Provider (at least one required)
      #- ANTHROPIC_API_KEY=sk-ant-...
      # - OPENCODE_API_KEY=${OPENCODE_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENCLAW_PRIMARY_MODEL=${OPENCLAW_PRIMARY_MODEL}
      # Auth
      - AUTH_USERNAME=${AUTH_USERNAME}
      - AUTH_PASSWORD=${AUTH_PASSWORD}

      # Gateway
      # IMPORTANT: lan is required if you publish 18789 (even to localhost) so it binds 0.0.0.0 in container
      - OPENCLAW_GATEWAY_BIND=${OPENCLAW_GATEWAY_BIND:-lan}
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      - OPENCLAW_GATEWAY_PORT=${OPENCLAW_GATEWAY_PORT:-18789}

      # Browser sidecar
      - BROWSER_CDP_URL=http://browser:9222
      - BROWSER_DEFAULT_PROFILE=openclaw
      - BROWSER_EVALUATE_ENABLED=true
      # Hooks (optional)
      # - HOOKS_ENABLED=true
      # - HOOKS_TOKEN=my-hook-secret
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_DM_POLICY=${TELEGRAM_DM_POLICY}
      - TELEGRAM_ALLOW_FROM=${TELEGRAM_ALLOW_FROM}

      # Optional: if you want OpenClaw to persist state explicitly here
      - OPENCLAW_STATE_DIR=${OPENCLAW_STATE_DIR}

    volumes:
      - ./data/openclaw:/data
      # Optional: mount custom config if you have advanced settings
      # - ./openclaw.json:/app/config/openclaw.json:ro
    depends_on:
      - browser
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  browser:
    image: coollabsio/openclaw-browser:latest
    container_name: openclaw-browser
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - CHROME_CLI=--remote-debugging-port=9222
    volumes:
      - ./data/browser:/config
    shm_size: 2g
    restart: unless-stopped

# No volumes section needed when using bind mounts