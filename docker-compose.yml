services:
  openclaw:
    image: openclaw:qmd
    container_name: openclaw
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
      # Gateway: keep host-local only (safer). Mission Control can use ws://host.docker.internal:18789
      - "127.0.0.1:${OPENCLAW_GATEWAY_PORT:-18789}:${OPENCLAW_GATEWAY_PORT:-18789}"
    environment:
      # Provider (at least one required)
      #- ANTHROPIC_API_KEY=sk-ant-...
      # - OPENCODE_API_KEY=${OPENCODE_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENCLAW_PRIMARY_MODEL=${OPENCLAW_PRIMARY_MODEL}
      # Auth
      - AUTH_USERNAME=${AUTH_USERNAME}
      - AUTH_PASSWORD=${AUTH_PASSWORD}

      # Gateway
      # IMPORTANT: lan is required if you publish 18789 (even to localhost) so it binds 0.0.0.0 in container
      - OPENCLAW_GATEWAY_BIND=${OPENCLAW_GATEWAY_BIND:-lan}
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      - OPENCLAW_GATEWAY_PORT=${OPENCLAW_GATEWAY_PORT:-18789}

      # Browser sidecar
      - BROWSER_CDP_URL=http://browser:9222
      - BROWSER_DEFAULT_PROFILE=openclaw
      - BROWSER_EVALUATE_ENABLED=true
      # Hooks (optional)
      # - HOOKS_ENABLED=true
      # - HOOKS_TOKEN=my-hook-secret
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_DM_POLICY=${TELEGRAM_DM_POLICY}
      - TELEGRAM_ALLOW_FROM=${TELEGRAM_ALLOW_FROM}

      # Optional: if you want OpenClaw to persist state explicitly here
      - OPENCLAW_STATE_DIR=${OPENCLAW_STATE_DIR}

    volumes:
      - ./data/openclaw:/data
      - ./data/cm_team:/data/cm_team
      # Optional: mount custom config if you have advanced settings
      # - ./openclaw.json:/app/config/openclaw.json:ro
    depends_on:
      - browser
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  browser:
    image: coollabsio/openclaw-browser:latest
    container_name: openclaw-browser
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - CHROME_CLI=--remote-debugging-port=9222
    volumes:
      - ./data/browser:/config
    shm_size: 2g
    restart: unless-stopped

  cm_team:
    build:
      context: .
      dockerfile: Dockerfile.cm_team.cron
    container_name: cm-team-cron
    environment:
      - WORKSPACE_ROOT=/workspace
      - REVIEW_WINDOW_SECONDS=${REVIEW_WINDOW_SECONDS:-60}
      - TASK_TIMEOUT_SECONDS=${TASK_TIMEOUT_SECONDS:-600}
      - TIMEOUT_POLICY=${TIMEOUT_POLICY:-mark_stale}
      - EXECUTOR_MODE=${EXECUTOR_MODE:-mock}
      - EXECUTOR_COMMAND=${EXECUTOR_COMMAND:-/app/cm_team/openclaw_exec.sh {ROLE} "{TASK}" "{RESULT}"}
      - SOUL_ROOT=${SOUL_ROOT:-/soul}
      - EXECUTOR_TIMEOUT_SECONDS=${EXECUTOR_TIMEOUT_SECONDS:-240}
      - OPENCLAW_CONTAINER=${OPENCLAW_CONTAINER:-openclaw}
      - OPENCLAW_AGENT_TIMEOUT_SECONDS=${OPENCLAW_AGENT_TIMEOUT_SECONDS:-600}
      - OPENCLAW_SESSION_MODE=${OPENCLAW_SESSION_MODE:-isolated}
      - OPENCLAW_RESET_AGENT_SESSION=${OPENCLAW_RESET_AGENT_SESSION:-1}
      - OPENCLAW_PREFER_WORKSPACE_RESULT=${OPENCLAW_PREFER_WORKSPACE_RESULT:-1}
      - OPENCLAW_AGENT_RESEARCHER=${OPENCLAW_AGENT_RESEARCHER:-researcher}
      - OPENCLAW_AGENT_COPYWRITER=${OPENCLAW_AGENT_COPYWRITER:-copywriter}
      - OPENCLAW_AGENT_QA=${OPENCLAW_AGENT_QA:-qa}
      - OPENCLAW_AGENT_HUMANIZER=${OPENCLAW_AGENT_HUMANIZER:-humanizer}
      - MIN_RESULT_BYTES=${MIN_RESULT_BYTES:-200}
      - MAX_REVISIONS=${MAX_REVISIONS:-3}
      - RUN_POLICY=${RUN_POLICY:-queue}
      - TELEGRAM_BOT_TOKEN_CMTEAM=${TELEGRAM_BOT_TOKEN_CMTEAM:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_ALLOWED_USER_ID=${TELEGRAM_ALLOWED_USER_ID:-}
      - TELEGRAM_COMMAND_NAMESPACE=${TELEGRAM_COMMAND_NAMESPACE:-cm}
    volumes:
      - ./data/cm_team:/workspace
      - ./cm_soul:/soul:ro
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  openclaw-avengers:
    image: openclaw:qmd
    container_name: openclaw-avengers
    ports:
      - "${OPENCLAW_AVENGERS_PORT:-8081}:8080"
      - "127.0.0.1:${OPENCLAW_AVENGERS_GATEWAY_PORT:-18790}:${OPENCLAW_AVENGERS_GATEWAY_PORT:-18790}"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENCLAW_PRIMARY_MODEL=${OPENCLAW_AVENGERS_MODEL:-openrouter/moonshotai/kimi-k2.5}
      - AUTH_USERNAME=${OPENCLAW_AVENGERS_AUTH_USERNAME:-admin}
      - AUTH_PASSWORD=${OPENCLAW_AVENGERS_AUTH_PASSWORD:-}
      - OPENCLAW_GATEWAY_BIND=${OPENCLAW_AVENGERS_GATEWAY_BIND:-lan}
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_AVENGERS_GATEWAY_TOKEN:-}
      - OPENCLAW_GATEWAY_PORT=${OPENCLAW_AVENGERS_GATEWAY_PORT:-18790}
      - BROWSER_CDP_URL=http://browser-avengers:9222
      - BROWSER_DEFAULT_PROFILE=openclaw-avengers
      - BROWSER_EVALUATE_ENABLED=true
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN_AVENGERS:-}
      - TELEGRAM_DM_POLICY=${TELEGRAM_DM_POLICY_AVENGERS:-}
      - TELEGRAM_ALLOW_FROM=${TELEGRAM_ALLOW_FROM_AVENGERS:-}
      - OPENCLAW_STATE_DIR=${OPENCLAW_AVENGERS_STATE_DIR:-/data/.openclaw}
    volumes:
      - ./data/openclaw_avengers:/data
      - ./data/avengers_team:/data/avengers_team
    depends_on:
      - browser-avengers
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  browser-avengers:
    image: coollabsio/openclaw-browser:latest
    container_name: openclaw-browser-avengers
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - CHROME_CLI=--remote-debugging-port=9222
    volumes:
      - ./data/browser_avengers:/config
    shm_size: 2g
    restart: unless-stopped

  avengers_team:
    build:
      context: .
      dockerfile: Dockerfile.avengers_team.cron
    container_name: avengers-team-cron
    environment:
      - WORKSPACE_ROOT=/workspace
      - REVIEW_WINDOW_SECONDS=${AVENGERS_REVIEW_WINDOW_SECONDS:-60}
      - TASK_TIMEOUT_SECONDS=${AVENGERS_TASK_TIMEOUT_SECONDS:-600}
      - TIMEOUT_POLICY=${AVENGERS_TIMEOUT_POLICY:-mark_stale}
      - EXECUTOR_MODE=${AVENGERS_EXECUTOR_MODE:-command}
      - EXECUTOR_COMMAND=${AVENGERS_EXECUTOR_COMMAND:-/app/avengers_team/openclaw_exec.sh {ROLE} "{TASK}" "{RESULT}"}
      - SOUL_ROOT=${AVENGERS_SOUL_ROOT:-/soul}
      - EXECUTOR_TIMEOUT_SECONDS=${AVENGERS_EXECUTOR_TIMEOUT_SECONDS:-240}
      - OPENCLAW_CONTAINER=${AVENGERS_OPENCLAW_CONTAINER:-openclaw-avengers}
      - OPENCLAW_AGENT_TIMEOUT_SECONDS=${AVENGERS_OPENCLAW_AGENT_TIMEOUT_SECONDS:-600}
      - OPENCLAW_SESSION_MODE=${AVENGERS_OPENCLAW_SESSION_MODE:-isolated}
      - OPENCLAW_RESET_AGENT_SESSION=${AVENGERS_OPENCLAW_RESET_AGENT_SESSION:-1}
      - OPENCLAW_PREFER_WORKSPACE_RESULT=${AVENGERS_OPENCLAW_PREFER_WORKSPACE_RESULT:-1}
      - OPENCLAW_AGENT_WORKSPACE_PATH=${AVENGERS_OPENCLAW_AGENT_WORKSPACE_PATH:-/data/workspace/agents/avengers/agents}
      - OPENCLAW_AGENT_CAPTAIN_AMERICA=${OPENCLAW_AGENT_CAPTAIN_AMERICA:-captain-america}
      - OPENCLAW_AGENT_ALEX_HORMOZI=${OPENCLAW_AGENT_ALEX_HORMOZI:-alex-hormozi}
      - OPENCLAW_AGENT_BRIAN_TRACY=${OPENCLAW_AGENT_BRIAN_TRACY:-brian-tracy}
      - OPENCLAW_AGENT_APRIL_DUNFORD=${OPENCLAW_AGENT_APRIL_DUNFORD:-april-dunford}
      - OPENCLAW_AGENT_RUSSELL_BRUNSON=${OPENCLAW_AGENT_RUSSELL_BRUNSON:-russell-brunson}
      - OPENCLAW_AGENT_STEVE_BLANK=${OPENCLAW_AGENT_STEVE_BLANK:-steve-blank}
      - MIN_RESULT_BYTES=${AVENGERS_MIN_RESULT_BYTES:-200}
      - MAX_REVISIONS=${AVENGERS_MAX_REVISIONS:-3}
      - RUN_POLICY=${AVENGERS_RUN_POLICY:-queue}
      - TELEGRAM_BOT_TOKEN_AVENGERS=${TELEGRAM_BOT_TOKEN_AVENGERS:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN_AVENGERS:-}
      - TELEGRAM_ALLOWED_USER_ID=${TELEGRAM_ALLOWED_USER_ID_AVENGERS:-}
      - TELEGRAM_COMMAND_NAMESPACE=${TELEGRAM_COMMAND_NAMESPACE_AVENGERS:-av}
    volumes:
      - ./data/avengers_team:/workspace
      - ./avengers_soul:/soul:ro
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  openclaw-mentor:
    image: openclaw:qmd
    container_name: openclaw-mentor
    ports:
      - "${OPENCLAW_MENTOR_PORT:-8082}:8080"
      - "127.0.0.1:${OPENCLAW_MENTOR_GATEWAY_PORT:-18791}:${OPENCLAW_MENTOR_GATEWAY_PORT:-18791}"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENCLAW_PRIMARY_MODEL=${OPENCLAW_MENTOR_MODEL:-openrouter/moonshotai/kimi-k2.5}
      - AUTH_USERNAME=${OPENCLAW_MENTOR_AUTH_USERNAME:-admin}
      - AUTH_PASSWORD=${OPENCLAW_MENTOR_AUTH_PASSWORD:-}
      - OPENCLAW_GATEWAY_BIND=${OPENCLAW_MENTOR_GATEWAY_BIND:-lan}
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_MENTOR_GATEWAY_TOKEN:-}
      - OPENCLAW_GATEWAY_PORT=${OPENCLAW_MENTOR_GATEWAY_PORT:-18791}
      - BROWSER_CDP_URL=http://browser-mentor:9222
      - BROWSER_DEFAULT_PROFILE=openclaw-mentor
      - BROWSER_EVALUATE_ENABLED=true
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN_MENTOR:-}
      - TELEGRAM_DM_POLICY=${TELEGRAM_DM_POLICY_MENTOR:-allowlist}
      - TELEGRAM_ALLOW_FROM=${TELEGRAM_ALLOW_FROM_MENTOR:-}
      - OPENCLAW_STATE_DIR=${OPENCLAW_MENTOR_STATE_DIR:-/data/.openclaw}
    volumes:
      - ./data/openclaw_mentor:/data
    depends_on:
      - browser-mentor
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  browser-mentor:
    image: coollabsio/openclaw-browser:latest
    container_name: openclaw-browser-mentor
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - CHROME_CLI=--remote-debugging-port=9222
    volumes:
      - ./data/browser_mentor:/config
    shm_size: 2g
    restart: unless-stopped

  mentor_memory:
    image: python:3.12-slim
    container_name: mentor-memory-sync
    environment:
      - MENTOR_MEMORY_TIMEZONE=${MENTOR_MEMORY_TIMEZONE:-UTC}
      - MENTOR_MEMORY_SYNC_INTERVAL_SECONDS=${MENTOR_MEMORY_SYNC_INTERVAL_SECONDS:-300}
    volumes:
      - ./data/openclaw_mentor:/mentor_data
      - ./scripts/mentor_memory_rollup.py:/app/mentor_memory_rollup.py:ro
    command: >
      sh -lc 'while true; do
      python /app/mentor_memory_rollup.py --sessions-root /mentor_data/.openclaw/agents --agents main mentor --memory-dir /mentor_data/workspace/memory --timezone "$${MENTOR_MEMORY_TIMEZONE}";
      sleep "$${MENTOR_MEMORY_SYNC_INTERVAL_SECONDS}";
      done'
    restart: unless-stopped

# No volumes section needed when using bind mounts
