services:
  openclaw:
    image: coollabsio/openclaw:latest
    container_name: openclaw
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
      # Uncomment next line only if you need direct gateway access from LAN
      # - "${OPENCLAW_GATEWAY_PORT:-18789}:${OPENCLAW_GATEWAY_PORT:-18789}"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENCLAW_PRIMARY_MODEL=${OPENCLAW_PRIMARY_MODEL}
      - AUTH_USERNAME=${AUTH_USERNAME}
      - AUTH_PASSWORD=${AUTH_PASSWORD}
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_DM_POLICY=${TELEGRAM_DM_POLICY}
      - TELEGRAM_ALLOW_FROM=${TELEGRAM_ALLOW_FROM}
      - BROWSER_CDP_URL=http://browser:9222
      # Provider (at least one required)
      - OPENCODE_API_KEY=${OPENCODE_API_KEY}
      - OPENCLAW_PRIMARY_MODEL=opencode/kimi-k2.5
      # Auth
      - AUTH_USERNAME=${AUTH_USERNAME:-admin}
      - AUTH_PASSWORD=${AUTH_PASSWORD}
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      # Browser sidecar
      - BROWSER_CDP_URL=http://browser:9223
      - BROWSER_DEFAULT_PROFILE=openclaw
      - BROWSER_EVALUATE_ENABLED=true
      # - HOOKS_ENABLED=true
      # - HOOKS_TOKEN=${HOOKS_TOKEN}
    volumes:
      - ./data/openclaw:/data
      - ./data/cm_team:/data/cm_team
      # Optional: mount custom config if you have advanced settings
      # - ./openclaw.json:/app/config/openclaw.json:ro
    depends_on:
      - browser
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  browser:
    image: coollabsio/openclaw-browser:latest
    container_name: openclaw-browser
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - CHROME_CLI=--remote-debugging-port=9222
    volumes:
      - ./data/browser:/config
    shm_size: 2g
    restart: unless-stopped

  cm_team:
    build:
      context: .
      dockerfile: Dockerfile.cm_team.cron
    container_name: cm-team-cron
    environment:
      - WORKSPACE_ROOT=/workspace
      - REVIEW_WINDOW_SECONDS=${REVIEW_WINDOW_SECONDS:-300}
      - TASK_TIMEOUT_SECONDS=${TASK_TIMEOUT_SECONDS:-600}
      - TIMEOUT_POLICY=${TIMEOUT_POLICY:-mark_stale}
      - EXECUTOR_MODE=${EXECUTOR_MODE:-mock}
      - EXECUTOR_COMMAND=${EXECUTOR_COMMAND:-/app/cm_team/openclaw_exec.sh {ROLE} "{TASK}" "{RESULT}"}
      - SOUL_ROOT=${SOUL_ROOT:-/soul}
      - EXECUTOR_TIMEOUT_SECONDS=${EXECUTOR_TIMEOUT_SECONDS:-240}
      - OPENCLAW_CONTAINER=${OPENCLAW_CONTAINER:-openclaw}
      - OPENCLAW_AGENT_TIMEOUT_SECONDS=${OPENCLAW_AGENT_TIMEOUT_SECONDS:-600}
      - OPENCLAW_AGENT_RESEARCHER=${OPENCLAW_AGENT_RESEARCHER:-researcher}
      - OPENCLAW_AGENT_COPYWRITER=${OPENCLAW_AGENT_COPYWRITER:-copywriter}
      - OPENCLAW_AGENT_QA=${OPENCLAW_AGENT_QA:-qa}
      - OPENCLAW_AGENT_HUMANIZER=${OPENCLAW_AGENT_HUMANIZER:-humanizer}
      - MIN_RESULT_BYTES=${MIN_RESULT_BYTES:-200}
      - MAX_REVISIONS=${MAX_REVISIONS:-3}
      - RUN_POLICY=${RUN_POLICY:-queue}
      - TELEGRAM_BOT_TOKEN_CMTEAM=${TELEGRAM_BOT_TOKEN_CMTEAM:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_ALLOWED_USER_ID=${TELEGRAM_ALLOWED_USER_ID:-}
      - TELEGRAM_COMMAND_NAMESPACE=${TELEGRAM_COMMAND_NAMESPACE:-cm}
    volumes:
      - ./data/cm_team:/workspace
      - ./cm_soul:/soul:ro
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  mission_control:
    build:
      context: .
      dockerfile: Dockerfile.mission_control
    container_name: openclaw-mission-control
    environment:
      - MISSION_CONTROL_PORT=8099
      - MISSION_CONTROL_DATA_ROOT=/data
    ports:
      - "${MISSION_CONTROL_PORT:-8099}:8099"
    volumes:
      - ./data:/data:ro
    restart: unless-stopped

# No volumes section needed when using bind mounts
